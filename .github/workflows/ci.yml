# Runs on every push and pull request: 3 plugins x PostgreSQL and MariaDB x Moodle 5.0 to 5.3 x PHP 8.3 and 8.4, plus PHP 8.2 on
# Moodle 5.0 and 5.1 only = 60 jobs. The actions are pinned to a commit; the tag is in the comment.
# See docs/DEVELOPMENT.md, section 8.
name: Moodle Plugin CI

on: [push, pull_request]

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run still in progress for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        plugin: [contenttype_mediabank, local_mediabank, filter_mediabank]
        php: ['8.2', '8.3', '8.4']
        moodle-branch: ['MOODLE_500_STABLE', 'MOODLE_501_STABLE', 'MOODLE_502_STABLE', 'MOODLE_503_STABLE']
        database: [pgsql, mariadb]
        exclude:
          # Moodle 5.2 and 5.3 need PHP 8.3 or later.
          - php: '8.2'
            moodle-branch: 'MOODLE_502_STABLE'
          - php: '8.2'
            moodle-branch: 'MOODLE_503_STABLE'

    steps:
      - name: Check out repository code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: repo
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          # If you are not using code coverage, keep "none". Otherwise, use "pcov" (Moodle 3.10 and up) or "xdebug".
          # If you try to use code coverage with "none", it will fallback to phpdbg (which has known problems).
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          # One test decodes a real video before and after it is prepared for streaming. It skips itself without ffmpeg.
          sudo apt-get install -y --no-install-recommends ffmpeg
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: |
          # local_mediabank and filter_mediabank depend on contenttype_mediabank, so it is installed as an extra plugin.
          mkdir -p extra && cp -r ./repo/contenttype_mediabank extra/
          moodle-plugin-ci install --plugin ./repo/${{ matrix.plugin }} --db-host=127.0.0.1 \
            ${{ matrix.plugin != 'contenttype_mediabank' && '--extra-plugins=./extra' || '' }}
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
          # Uncomment this to run Behat tests using the Moodle App.
          # MOODLE_APP: 'true'

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true # This step will show errors but will not fail
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        id: behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome --scss-deprecations

      - name: Upload Behat Faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Behat Faildump (${{ join(matrix.*, ', ') }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1

  # Builds the zips the way a release does and runs Moodle's own installer validation on each one, on every supported
  # Moodle version. The validator needs a site where the plugin is not installed, so the site is made with a throwaway
  # plugin (local_cidummy) in place of the real ones. See docs/RELEASING.md, section 4.
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        moodle-branch: ['MOODLE_500_STABLE', 'MOODLE_501_STABLE', 'MOODLE_502_STABLE', 'MOODLE_503_STABLE']

    steps:
      - name: Check out repository code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: repo
          persist-credentials: false

      - name: Build the zips twice and check they are identical
        run: |
          python3 repo/scripts/build_release.py --out dist-a
          python3 repo/scripts/build_release.py --out dist-b
          (cd dist-a && sha256sum *.zip) > a.sum
          (cd dist-b && sha256sum *.zip) > b.sum
          cat a.sum
          diff a.sum b.sum
          test "$(ls dist-a/*.zip | wc -l)" -eq 4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install Moodle with a throwaway plugin
        run: |
          mkdir -p dummy/local_cidummy/lang/en
          {
            echo "<?php"
            echo "defined('MOODLE_INTERNAL') || die();"
            echo "\$plugin->component = 'local_cidummy';"
            echo "\$plugin->version = 2026010100;"
            echo "\$plugin->requires = 2025041400;"
          } > dummy/local_cidummy/version.php
          {
            echo "<?php"
            echo "defined('MOODLE_INTERNAL') || die();"
            echo "\$string['pluginname'] = 'CI dummy';"
          } > dummy/local_cidummy/lang/en/local_cidummy.php
          moodle-plugin-ci install --plugin ./dummy/local_cidummy --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: Validate each plugin zip with Moodle's installer checks
        run: |
          for component in contenttype_mediabank local_mediabank filter_mediabank; do
            zip=$(realpath dist-a/${component}_*.zip)
            echo "== $zip"
            php repo/scripts/validate_plugin_zip.php --moodle="$PWD/moodle" --zip="$zip" --component="$component"
          done
